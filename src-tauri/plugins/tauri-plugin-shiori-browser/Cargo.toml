[package]
name = "tauri-plugin-shiori-browser"
version = "0.1.0"
description = "In-rail native embedded browser panel for Shiori on tablets (iOS WKWebView / Android WebView)."
authors = ["Jesse Zhang"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
# Unique per-plugin `links` key so tauri-build can propagate the plugin's
# permissions/native-project paths to the app crate (see tauri mobile plugin
# guide). Must not collide with any other plugin in the dep graph.
links = "tauri-plugin-shiori-browser"

[dependencies]
tauri = { version = "=2.11.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }
