[package]
name = "tauri-plugin-shiori-metrics"
version = "0.1.0"
description = "Native process CPU/memory metrics for Shiori on Android (own-process read via Kotlin)."
authors = ["Jesse Zhang"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
# Unique per-plugin `links` key so tauri-build can propagate the plugin's
# permissions/native-project paths to the app crate. Must not collide with any
# other plugin in the dep graph (mirrors tauri-plugin-shiori-browser).
links = "tauri-plugin-shiori-metrics"

[dependencies]
tauri = { version = "=2.11.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }
