[[permission]]
identifier = "desktop-app-commands"
description = "Allows Shiori's desktop application commands from the trusted main webview only."
commands.allow = [
  "open_document_dialog",
  "open_pdf_dialog",
  "pick_folder",
  "classify_open_target",
  "list_folder_entries",
  "read_document_info_at_path",
  "read_document_bytes_at_path",
  "read_text_document_relative_image",
  "write_text_document_at_path",
  "read_pdf_info_at_path",
  "read_pdf_bytes_at_path",
  "save_pdf_dialog",
  "open_exported_pdf",
  "reveal_exported_pdf",
  "open_external_url",
  "list_external_terminals",
  "detect_agent_clis",
  "list_system_fonts",
  "open_external_terminal",
  "web_panel_open",
  "web_panel_navigate",
  "web_panel_set_bounds",
  "web_panel_hide",
  "web_panel_back",
  "web_panel_forward",
  "web_panel_reload",
  "web_panel_close",
  "terminal_spawn",
  "terminal_write",
  "terminal_write_binary",
  "terminal_resize",
  "terminal_kill",
  "get_process_metrics",
  "runtime_guard_status",
  "drain_pending_open_paths",
  "ack_pending_open_path",
  "resolve_app_exit",
  "set_app_exit_guard_ready",
  "live_api_update_context",
  "live_api_authorize_mutation",
  "live_api_complete",
  "pdf_core_open",
  "pdf_core_render",
  "pdf_core_cancel",
  "pdf_core_close",
  "pdf_core_hide_annotations",
  "pdf_core_outline",
  "pdf_core_links",
  "pdf_core_page_text",
  "pdf_core_decrypted_copy",
  "pdf_core_page_geometry",
  "pdf_core_page_fonts",
  "pdf_core_font_outlines",
  "pdf_core_security",
  "pdf_core_encrypt_like_source",
]
