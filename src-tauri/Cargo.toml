[package]
name = "shiori"
version = "26.10.20"
description = "Local-first document reader and PDF editor"
authors = ["Jesse Zhang"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88"

[lints.rust]
# objc 0.2's macros still probe this historical cfg. Declare it explicitly so
# modern rustc check-cfg keeps reporting real unknown cfgs without printing one
# warning per Objective-C message send.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Tauri 2 enables devtools automatically in debug builds (`tauri dev`),
# so we leave the `devtools` feature off here — release bundles ship
# without ⌘⌥I / "Inspect Element" exposed to end users.
# `unstable` unlocks multi-webview-per-window (`Window::add_child`), used by
# the embedded Browser panel to host remote pages in a native child
# webview. The version is pinned, so the unstable API surface stays fixed.
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# base64 is used by the shared export-filename decode helper, which runs on
# desktop *and* mobile (the Tauri IPC filename header is Base64 on both), so it
# must stay an unconditional dependency — not desktop-only.
base64 = "0.22"
# tauri-specta makes the Rust command signatures the single source of truth for
# the IPC type contract: `#[specta::specta]` on every command plus
# `#[derive(specta::Type)]` on each payload struct feed a generated TypeScript
# binding (`src/platform/bindings.ts`), so changing a Rust signature breaks the
# TS build. Pinned to the rc line validated with tauri 2.11 (specta v2 is still
# pre-1.0). `function` powers `#[specta::specta]`; `serde_json` gives Type for the
# `serde_json::Value` fields the Live API payloads carry. Kept unconditional (not
# target-gated) because the collect_commands! Builder is compiled in `run()` on
# every platform, exactly like the generate_handler! it replaces.
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Page rendering on PDFium (docs/PLAN-RUST-PDF-CORE-2026-09.md, stage 3). A
# path dependency, built into this target/ dir: crates/ has no workspace.
shiori-core = { path = "../crates/shiori-core" }
# Generates the per-launch Live API bearer token and request identifiers from
# the operating system CSPRNG. Never substitute timestamps or process IDs.
getrandom = "0.3"
# Serializes descriptor replacement and token-owned cleanup across app
# instances so an exiting process cannot remove a newer instance's endpoint.
fs2 = "0.4"
portable-pty = "0.9"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Restores the main window's size/position/maximized/fullscreen across
# launches (the tauri.conf.json width/height become first-launch defaults).
# Desktop-only: mobile windows are OS-managed and have no persistent frame.
tauri-plugin-window-state = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# libc backs the embedded-terminal reaper on Unix: the shell is a setsid
# session leader, and every process group in its session (its own and each
# job's) is killpg()'d, found via getsid()/getpgid() (terminal/reaper.rs).
# Declared explicitly rather than relied on transitively — per the base64
# cfg-gated-dependency postmortem (2026-06-12). Unused on Windows (that path
# uses taskkill /T) but compiles cleanly there.
libc = "0.2"
# Enumerates installed desktop font families without exposing file paths or
# font bytes to the webview. Kept desktop-only so mobile bundles do not compile
# filesystem/fontconfig discovery code.
fontdb = "=0.23.0"
# The Browser panel's hooks into its engine live in the vendored wry
# (patches/wry-0.55.1/src/shiori.rs): tauri-runtime-wry cannot pass a new
# builder option through. Same crate Tauri builds (the [patch] below), with
# no features of its own.
wry = { version = "=0.55.1", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Native Objective-C bridges: AppKit's mixed file/folder open panel on macOS
# and tao's reader-mode view-controller toggles on iOS.
objc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
mach2 = "0.4"
# Reader-mode immersive toggle: message tao's root view controller
# (setPrefersStatusBarHidden:) from the set_reader_immersive command. objc 0.2
# matches the runtime crate tao itself uses.
raw-window-handle = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
# Android-only: reads the app's own process CPU/memory via Kotlin (Process /
# ActivityManager) for the resource panel. NOT in the shared mobile table — its
# native impl is Android-specific; iOS reads metrics via Mach directly in lib.rs.
tauri-plugin-shiori-metrics = { path = "plugins/tauri-plugin-shiori-metrics" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2.5.4"
# In-rail native embedded browser panel for tablets (iOS WKWebView / Android
# WebView). Mobile-only: desktop uses the native child-webview path in lib.rs.
tauri-plugin-shiori-browser = { path = "plugins/tauri-plugin-shiori-browser" }

[dev-dependencies]
# Emits `src/platform/bindings.ts` from the tauri-specta Builder in the
# `export_typescript_bindings` test (`cargo test export_typescript_bindings`).
# Dev-only: shipping builds neither generate nor format TypeScript.
specta-typescript = "=0.0.9"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[patch.crates-io]
tao = { path = "patches/tao-0.35.3" }
wry = { path = "patches/wry-0.55.1" }
