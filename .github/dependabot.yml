# Workflow actions are pinned to commit SHAs with a `# vX.Y.Z` comment;
# Dependabot bumps both together. JS and Rust dependencies are updated by
# hand (AGENTS.md), so only github-actions is listed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
