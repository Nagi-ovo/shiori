name: ci

# The merge gate: what AGENTS.md calls sealed (`bun run verify` plus
# `bun run test:core`) on every pull request and every push to main.
#
# Caches are restored on every run but written only by pushes to main. A PR
# cannot read another PR's cache anyway, and letting PRs write would let any
# branch, including a fork's, seed what main later restores.

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR supersedes its previous run; main runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # test:core runs cargo fmt and clippy, which the minimal profile leaves
      # out; `bun run build` compiles shiori-core to wasm.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      # scripts/pdfium/build-wasm.ts installs the pinned wasm-bindgen CLI into
      # vendor/tools on a miss, which is a multi-minute `cargo install`.
      - name: Restore wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/tools
          key: wasm-bindgen-0.2.129-${{ runner.os }}-${{ runner.arch }}

      - name: Cache Rust build (deps + registry)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/shiori-core -> target
            crates/shiori-core-node -> target
            crates/shiori-core-wasm -> target
          shared-key: "ci"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same version as release.yml and the dev machine.
          bun-version: 1.3.12

      # site/ is its own project with its own lockfile.
      - name: Install JS dependencies
        run: |
          bun install --frozen-lockfile
          cd site && bun install --frozen-lockfile

      # The steps from here to "Build and lint the site" are `bun run verify`
      # with its test leg split in two, so keep them in step with package.json.
      - name: Build
        run: bun run build

      - name: Save wasm-bindgen CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/tools
          key: wasm-bindgen-0.2.129-${{ runner.os }}-${{ runner.arch }}

      - name: Lint
        run: bun run lint

      # Before the JS tests: it builds the shiori-core node addon, and the
      # tests that need it (the encrypted page-merge cases) skip
      # without it rather than fail.
      - name: Rust core (fmt, clippy, tests, node + wasm bindings)
        run: bun run test:core

      - name: Test (all but the timing-sensitive files)
        run: >-
          bun run test
          --path-ignore-patterns 'src/editor/components/DocxViewer.layout.test.tsx'
          --path-ignore-patterns 'src/editor/components/ExternalTerminalLauncher.test.tsx'

      # These two flake under CPU contention (AGENTS.md, "Build / lint / test
      # before commit"), and a shared runner is contention. They run alone,
      # and once more on failure; a second failure fails the job. The retry is
      # flagged so a test that keeps needing it gets noticed.
      - name: Test the timing-sensitive files (one retry)
        run: |
          files=(
            src/editor/components/DocxViewer.layout.test.tsx
            src/editor/components/ExternalTerminalLauncher.test.tsx
          )
          if ! bun test "${files[@]}"; then
            echo "::warning title=Timing-sensitive tests retried::First run failed; retrying once."
            bun test "${files[@]}"
          fi

      - name: Build and lint the site
        working-directory: site
        run: bun run build && bun run lint
