name: release

# Windows + Linux + Android release workflow.
#
# macOS bundles are signed and notarized on the maintainer's Mac
# (scripts/build-signed.sh). CI's job is to hand back the Windows, Linux, and
# Android artifacts the maintainer can't easily produce locally:
#   - Windows: .msi + .msi.sig (installer + Tauri Ed25519 updater signature)
#   - Linux:   .deb (Debian/Ubuntu install) + .AppImage + .AppImage.sig
#              (portable + Tauri Ed25519 for auto-update)
#   - Android: signed .aab (Google Play) + signed .apk (direct install/testing)
#
# Binaries are attached to this repository's GitHub release for the tag,
# uploaded with the job's own GITHUB_TOKEN. Only the jobs that create the
# release or upload to it get `contents: write`.
#
# Signing material (the Tauri updater key and the Android upload keystore)
# lives in the `release` environment, so only jobs that declare
# `environment: release` can read it. The cache-warm job declares none: it
# builds without updater artifacts and never sees a signing secret.
#
# The platform jobs live in release-{windows,linux,android}.yml and run as
# reusable workflows. A `./` reusable workflow comes from this file's commit,
# never from the checked-out tree, so a dispatch from `main` runs main's
# workflow files whatever ref the jobs check out.
#
# Trigger:
#   - push a tag matching `v*` (e.g. `v0.1.0`)  → full release (build + upload)
#   - workflow_dispatch with a `tag` input and
#     `publish_to_release_repo=false`            → build artifacts for analysis
#   - workflow_dispatch with a `tag` input and
#     `publish_to_release_repo=true`             → full release for that tag
#   - workflow_dispatch with `android_only=true` → rebuild/upload only Android
#   - workflow_dispatch with no `tag`, or the    → cache-warm only (build, no
#     weekly schedule                              signing, no upload)
#
# What each run builds: a publishing dispatch checks out the tag named in
# `tag`, so a re-run from `main` with fixed workflows still ships the tagged
# code, and fails if that tag does not exist. Every other run builds the ref
# it ran on: the pushed tag, or the dispatched branch for analysis runs (the
# label then need not be a tag yet, as for a pre-release test APK).
#
# Why the schedule: GitHub scopes Actions caches per ref. A tag run can only
# restore caches created on its own tag ref or on the default branch — never
# another tag's. Since every release is a fresh tag and nothing else populated
# a cache on `main`, every release rebuilt all deps cold (~10 min on Windows).
# The weekly warm-cache job on the default branch keeps a release-readable
# cache warm; release upload steps are gated to tag push or manual dispatch
# with the explicit publish switch enabled.
on:
  push:
    tags:
      - 'v*'
  schedule:
    # Mondays 06:00 UTC — keeps the main-scoped build cache younger than
    # GitHub's 7-day idle eviction so the next release restores it.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version label to build (e.g. v0.1.15). Leave empty to only warm the build cache.'
        required: false
        type: string
      publish_to_release_repo:
        description: 'Upload artifacts to this repo''s GitHub release for the tag. Keep false for artifact-only analysis runs.'
        required: false
        default: false
        type: boolean
      android_artifacts:
        description: 'Android artifacts to build: both (default), apk (direct arm64 only — fast hotfix), aab (Play Console only).'
        required: false
        default: both
        type: choice
        options:
          - both
          - apk
          - aab
      android_only:
        description: 'Only build Android artifacts. Useful for replacing APK/AAB without rebuilding desktop CI artifacts.'
        required: false
        default: false
        type: boolean

permissions: {}

# One run per tag at a time. Two overlapping runs of a tag (a push still
# going and the re-dispatch the release skill recommends) --clobber the same
# assets file by file and can leave one run's .msi beside the other's
# .msi.sig. A second run waits instead; GitHub keeps one pending run per
# group, so a third replaces it. ref_name, not ref, so a push (refs/tags/vX)
# and a dispatch with tag=vX share the group.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release-version:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      # write: creates the draft release the platform jobs upload to.
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Publishing builds the tag itself, even from a dispatch on main;
          # every other run builds the ref it ran on (see the top of this
          # file). The platform workflows check out the same ref.
          ref: ${{ inputs.publish_to_release_repo && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Match release label to application version
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          set -eu
          if [ -n "${MANUAL_TAG:-}" ]; then
            tag="$MANUAL_TAG"
          else
            tag="${PUSHED_REF#refs/tags/}"
          fi
          version="$(sed -nE 's/.*"version": "([^"]+)".*/\1/p' src-tauri/tauri.conf.json | head -1)"
          if [ "$tag" != "v$version" ] && [[ "$tag" != "v$version-"* ]]; then
            echo "Release label $tag does not match application version $version"
            exit 1
          fi

      # The one creator: every uploading job needs this job. When each
      # created it on a miss, two could both miss; under set -eu the loser
      # failed before uploading, or both succeeded and left two drafts for
      # one tag with the assets split between them.
      - name: Create the draft release
        if: (github.event_name == 'push' || inputs.publish_to_release_repo == true) && !(inputs.android_only && inputs.android_artifacts == 'aab')
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          set -eu
          tag="${MANUAL_TAG:-${PUSHED_REF#refs/tags/}}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --title "Shiori $tag" \
              --notes "Beta build. macOS binaries uploaded separately by the maintainer."
          fi

  warm-cache:
    # Schedule / tagless dispatch: compile the Windows and Linux release
    # builds on main so the next tag restores their dependency cache (see the
    # top of this file). No environment, so no signing secret reaches this
    # job, and no updater artifacts, so it needs none. Keep the cache steps
    # in step with release-windows.yml / release-linux.yml: the shared-key,
    # runner image and toolchain must match for a tag run to restore what
    # this saves.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    name: warm-cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Cache wasm-bindgen CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/tools
          key: wasm-bindgen-0.2.129-${{ runner.os }}-${{ runner.arch }}

      - name: Exclude build dirs from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction SilentlyContinue

      - name: Cache Rust build (deps + registry)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            crates/shiori-core-wasm -> target
          shared-key: "tauri-release"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file \
            wget \
            build-essential

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          # See release-windows.yml.
          no-cache: ${{ runner.os == 'Windows' }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundle (unsigned)
        run: bun run tauri build

  build-windows:
    # Tag push, or a dispatch with a tag; schedule / tagless dispatch go to
    # warm-cache instead.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.android_only != true)
    needs: validate-release-version
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows.yml
    with:
      tag: ${{ inputs.tag }}
      publish_to_release_repo: ${{ inputs.publish_to_release_repo == true }}
    secrets: inherit

  build-linux:
    # Same gate as build-windows.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.android_only != true)
    needs: validate-release-version
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ inputs.tag }}
      publish_to_release_repo: ${{ inputs.publish_to_release_repo == true }}
    secrets: inherit

  build-android:
    # Android release builds require the upload keystore, which only the
    # `release` environment holds. Cache-warm runs skip this job.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: validate-release-version
    permissions:
      contents: write
    uses: ./.github/workflows/release-android.yml
    with:
      tag: ${{ inputs.tag }}
      publish_to_release_repo: ${{ inputs.publish_to_release_repo == true }}
      android_artifacts: ${{ inputs.android_artifacts }}
    secrets: inherit
