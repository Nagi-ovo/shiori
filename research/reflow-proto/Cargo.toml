[package]
name = "shiori-reflow-proto"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
harfrust = "=0.16.0"
ttf-parser = "=0.25.1"
unicode-linebreak = "=0.1.5"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
