<h1>唐詩選抄</h1>
<p class='author'>李白・王之渙・孟浩然・王維</p><p>靜夜思<br>李白</p><p>牀前明月光，疑是地上霜。<br>舉頭望明月，低頭思故鄉。</p><p>登鸛雀樓<br>王之渙</p><p>白日依山盡，黃河入海流。<br>欲窮千里目，更上一層樓。</p><p>春曉<br>孟浩然</p><p>春眠不覺曉，處處聞啼鳥。<br>夜來風雨聲，花落知多少。</p><p>竹里館<br>王維</p><p>獨坐幽篁裏，彈琴復長嘯。<br>深林人不知，明月來相照。</p><p>本文は著作権保護期間の満了した漢詩である。字体はオープンフォントライセンスの源ノゴシック系書体による。本PDFの組版はクリエイティブ・コモンズ表示四・〇で提供する。</p>
