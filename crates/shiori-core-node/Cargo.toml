[package]
name = "shiori-core-node"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Node addon exposing shiori-core to the CLI (docs/PLAN-RUST-PDF-CORE-2026-09.md, R3)"

[lib]
crate-type = ["cdylib"]

[dependencies]
shiori-core = { path = "../shiori-core" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
