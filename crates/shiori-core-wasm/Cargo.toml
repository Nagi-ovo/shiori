[package]
name = "shiori-core-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "shiori-core for the web and mobile builds: wasm-bindgen over PDFium's Emscripten build (docs/PLAN-RUST-PDF-CORE-2026-09.md, 4.6)"

[lib]
crate-type = ["cdylib"]

[dependencies]
shiori-core = { path = "../shiori-core" }
# Its `initialize_pdfium_render` export is how the page hands over the
# Emscripten PDFium module; pinned with the core.
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
# Must equal vendor/tools' wasm-bindgen CLI (scripts/pdfium/build-wasm.ts).
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
